[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "prompt2play"
version = "0.1.0"
description = "Generate, validate, and preview playable HTML5 games from natural-language prompts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17,<2",
    "celery[redis]>=5.5,<6",
    "fastapi>=0.119,<1",
    "openai>=2.6,<3",
    "playwright>=1.55,<2",
    "psycopg[binary]>=3.2.10,<4",
    "pydantic-settings>=2.11,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=6,<8",
    "sqlalchemy>=2.0.44,<3",
    "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/CONTRIBUTING.md",
  "/README.md",
  "/SECURITY.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prompt2play"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
ignore = ["RUF001"] # Product-facing copy is intentionally Russian.

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
exclude = ["^artifacts/"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=prompt2play",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=50",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["prompt2play"]

[tool.coverage.report]
show_missing = true
skip_covered = true
