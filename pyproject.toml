[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "prompt2play"
version = "0.1.0"
description = "Generate, validate, and preview playable HTML5 games from natural-language prompts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<6",
  "djangorestframework>=3.16,<4",
  "dj-database-url>=3,<4",
  "gunicorn>=23,<24",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "langgraph>=1,<2",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "whitenoise>=6.8,<7",
]

[project.scripts]
prompt2play = "prompt2play.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-django>=4.9,<5",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/tools",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/CONTRIBUTING.md",
  "/README.md",
  "/SECURITY.md",
  "/docs",
  "/web/src",
  "/web/tests",
  "/web/package.json",
  "/web/package-lock.json",
  "/web/index.html",
  "/web/tsconfig.json",
  "/web/vite.config.ts",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prompt2play"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "prompt2play/resources/studio"

[tool.hatch.build.targets.sdist.force-include]
"web/dist" = "web/dist"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/prompt2play/resources/legacy"]

[tool.ruff.lint.per-file-ignores]
# Migrated donor style stays isolated; syntax/name checks still apply.
"src/prompt2play/legacy/**/*.py" = ["B", "E4", "E7", "I", "RUF", "SIM", "UP"]
"src/prompt2play/adapters/django/**/*.py" = ["B", "E4", "E7", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
exclude = ["^artifacts/", "^src/prompt2play/resources/"]

[[tool.mypy.overrides]]
# Existing donor adapters are migrated incrementally; new core remains strict.
module = ["prompt2play.legacy.*", "prompt2play.adapters.django.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["django.*", "rest_framework.*", "dj_database_url.*", "whitenoise.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.3"
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=prompt2play.application",
  "--cov=prompt2play.contracts",
  "--cov=prompt2play.generation",
  "--cov=prompt2play.adapters.artifacts",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "prompt2play.adapters.django.config.settings"

[tool.coverage.run]
source = ["prompt2play.application", "prompt2play.contracts", "prompt2play.generation", "prompt2play.adapters.artifacts"]
omit = ["*/legacy/*", "*/adapters/django/*", "*/resources/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
