[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gameforge-mini"
version = "0.1.0"
description = "Fast, editable HTML5 mini-games"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<6", "djangorestframework>=3.16,<4", "celery>=5.5,<6",
  "redis>=5,<7", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "pydantic>=2.11,<3", "jsonschema>=4.23,<5", "beautifulsoup4>=4.13,<5",
  "gunicorn>=23,<24", "whitenoise>=6.9,<7", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-django>=4.11,<5", "pytest-cov>=6,<8", "ruff>=0.12", "mypy>=1.16", "types-requests", "playwright==1.58.0"]

[tool.setuptools.packages.find]
include = ["gameforge*", "studio*", "generation*", "validation*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gameforge.settings"
pythonpath = ["."]
testpaths = ["tests", "studio/tests"]
addopts = "-q"
markers = ["browser: requires an isolated browser", "native_browser: requires native OS sandbox and prepared browser", "live: explicitly budgeted real model test"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["docs/sources", "studio/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
