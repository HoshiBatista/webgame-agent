name: Mini-games
on: [push, pull_request]
permissions: {contents: read}
jobs:
  native-validator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-native-validator-not-a-deployment-secret
      GAMEFORGE_PROVIDER: fake
      VALIDATOR_BACKEND: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.lock}
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements-dev.lock
      - run: .venv/bin/python -m pip check
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow system bubblewrap namespaces on Ubuntu 24.04
        if: matrix.os == 'ubuntu-24.04'
        run: |
          command -v bwrap
          sysctl kernel.apparmor_restrict_unprivileged_userns
          sudo apparmor_parser -a deploy/apparmor/gameforge-bwrap
      - run: .venv/bin/python -m playwright install-deps chromium webkit
      - run: .venv/bin/python scripts/native.py prepare
      - name: Prepare WebKit for public runtime tests
        run: PLAYWRIGHT_BROWSERS_PATH="$PWD/.data/native-validator/browsers" .venv/bin/python -m playwright install webkit
      - name: Player, audio and preview tests in the OS sandbox (Chromium and WebKit)
        run: .venv/bin/python scripts/verify_runtime_browser.py
      - run: .venv/bin/pytest tests/test_native_validation.py
      - run: .venv/bin/pytest tests/test_validation.py -m browser -k 'not real_unix_transport and not state_snapshot'
      - run: .venv/bin/pytest tests/test_source_map.py -m browser
      - name: Repeated cold starts and fraction input (no retries)
        run: |
          for attempt in $(seq 1 10); do
            echo "Cold-start regression $attempt/10"
            .venv/bin/pytest tests/test_validation.py -m browser -k fraction_input || exit 1
          done
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_USER: forge, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: gameforge}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U forge" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://forge:ci-only@127.0.0.1:5432/gameforge
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_SECRET_KEY: ci-only-not-used-in-any-deployment-000000000000
      GAMEFORGE_PROVIDER: fake
      GAMEFORGE_MODEL: fixture
      VALIDATOR_CONTAINER: gf-mini-validator-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.lock}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: ruff check gameforge studio generation validation scripts tests
      - run: mypy generation validation --ignore-missing-imports
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: pytest tests studio/tests -m 'not browser and not live'
      - run: npm ci && npm run lint && npm run build && npm test
        working-directory: web
      - run: sh scripts/validator-start.sh
      - name: All container browser scenarios, including studio workflows
        run: pytest tests studio/tests -m 'browser and not native_browser and not runtime_browser and not live'
  compose-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_FILE: compose.yaml:deploy/observability.compose.yaml
      COMPOSE_PROJECT_NAME: gameforge-ci-acceptance
      CONTAINER_PROVIDER: fake
      CONTAINER_MODEL: fixture
      DJANGO_SECRET_KEY: ci-only-compose-acceptance-not-a-deployment-secret
      DJANGO_SUPERUSER_USERNAME: ci-user
      DJANGO_SUPERUSER_PASSWORD: ci-only-not-a-deployment-password
      POSTGRES_PASSWORD: 0123456789abcdef
      GAMEFORGE_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.lock}
      - run: pip install -r requirements.lock && python -m pip check
      - name: Prepare private monitoring secrets
        run: python scripts/prepare_observability.py
      - name: Build and start the disposable stack
        run: |
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file /dev/null up -d --build --wait --wait-timeout 180
      - name: Validate monitoring configuration and alert examples
        run: |
          docker compose --env-file /dev/null run --rm --no-deps --entrypoint /bin/promtool prometheus check config /etc/prometheus/prometheus.yaml
          docker compose --env-file /dev/null run --rm --no-deps --entrypoint /bin/promtool -v "$PWD/deploy/observability:/rules:ro" -w /rules prometheus test rules rules.test.yaml
          docker compose --env-file /dev/null run --rm --no-deps otel-collector validate --config=/etc/otelcol/config.yaml
          docker compose --env-file /dev/null run --rm --no-deps loki -config.file=/etc/loki/config.yaml -verify-config
      - name: Wait for provisioned dashboards and telemetry storage
        run: python scripts/verify_observability.py --ready-only --timeout 180 --output .data/ci-observability-ready.json
      - name: Create, edit, publish, remix and export over real HTTP
        run: python scripts/verify_container.py --output .data/ci-container-verification.json
      - name: Application works while telemetry collection is unavailable
        run: |
          docker compose --env-file /dev/null stop otel-collector
          python scripts/verify_container.py --output .data/ci-observability-outage-acceptance.json
          docker compose --env-file /dev/null up -d otel-collector
      - name: Verify real metrics, complete run trace and linked event
        run: python scripts/verify_observability.py --output .data/ci-observability-verification.json
      - name: Stack diagnostics
        if: failure()
        run: docker compose --env-file /dev/null logs --no-color --tail=150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-acceptance
          path: |
            .data/ci-container-verification.json
            .data/ci-observability-*.json
          if-no-files-found: ignore
      - name: Remove only this job's stack and volumes
        if: always()
        run: docker compose --env-file /dev/null down --volumes --remove-orphans
