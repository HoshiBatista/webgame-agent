name: Mini-games
on: [push, pull_request]
permissions: {contents: read}
jobs:
  native-validator:
    runs-on: ubuntu-22.04
    env:
      DJANGO_SECRET_KEY: ci-only-native-validator-not-a-deployment-secret
      GAMEFORGE_PROVIDER: fake
      VALIDATOR_BACKEND: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.lock}
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements-dev.lock
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: .venv/bin/python -m playwright install-deps chromium
      - run: .venv/bin/python scripts/native.py prepare
      - run: .venv/bin/pytest tests/test_native_validation.py
      - run: .venv/bin/pytest tests/test_validation.py -m browser -k 'not real_unix_transport and not state_snapshot'
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_USER: forge, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: gameforge}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U forge" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://forge:ci-only@127.0.0.1:5432/gameforge
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_SECRET_KEY: ci-only-not-used-in-any-deployment-000000000000
      GAMEFORGE_PROVIDER: fake
      GAMEFORGE_MODEL: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.lock}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: pip install -r requirements-dev.lock
      - run: ruff check gameforge studio generation validation scripts tests
      - run: mypy generation validation --ignore-missing-imports
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: pytest tests studio/tests -m 'not browser and not live'
      - run: npm ci && npm run lint && npm run build && npm test
        working-directory: web
      - run: sh scripts/validator-start.sh
      - run: pytest tests/test_validation.py -m browser
      - name: Verify container definitions
        env:
          DJANGO_SUPERUSER_USERNAME: ci-user
          DJANGO_SUPERUSER_PASSWORD: ci-only-not-a-deployment-password
        run: docker compose config --quiet && docker compose build
