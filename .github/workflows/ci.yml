name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  backend-quality:
    name: Backend / quality, migrations, package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      UV_PYTHON: "3.13"

    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - &python313
        name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - &uv
        name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Verify lock file and install dependencies
        run: |
          uv lock --check
          uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Strict type-check
        run: uv run mypy

      - name: Render the PostgreSQL migration offline
        run: uv run alembic upgrade head --sql > "${RUNNER_TEMP}/migration.sql"

      - name: Build and validate distributions
        run: |
          uv build
          uvx --from twine twine check dist/*

      - name: Smoke-test the built wheel in an isolated environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/pip" install --no-deps dist/*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -c "import prompt2play; print(prompt2play.__version__)"

  backend-unit:
    name: Backend / unit / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - *checkout

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - *uv

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run deterministic tests in parallel
        run: uv run pytest -m "not integration and not browser" -n auto

  frontend:
    name: Frontend / format, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web

    steps:
      - *checkout

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint typed source
        run: npm run lint

      - name: Run tests with coverage gates
        run: npm run test:coverage

      - name: Audit all npm dependencies
        run: npm audit --audit-level=high

      - name: Build production bundle
        run: npm run build

      - name: Upload frontend coverage and bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-evidence
          path: |
            web/coverage/
            web/dist/
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Backend / PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"
      P2P_DATABASE_URL: postgresql+psycopg://prompt2play:prompt2play@localhost:5432/prompt2play
      P2P_REDIS_URL: redis://localhost:6379/0
      P2P_ARTIFACT_ROOT: artifacts-ci
      P2P_BROWSER_VALIDATION: "false"
      P2P_INTEGRATION_TESTS: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prompt2play
          POSTGRES_USER: prompt2play
          POSTGRES_PASSWORD: prompt2play
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prompt2play"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - *checkout
      - *python313
      - *uv

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Verify Redis and reversible PostgreSQL migrations
        run: |
          uv run python -c "from redis import Redis; assert Redis.from_url('redis://localhost:6379/0').ping()"
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run full backend suite with the higher integration coverage gate
        run: uv run pytest -m "not browser" --cov-fail-under=65

      - name: Upload backend coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Generated game / Chromium mobile validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"
      P2P_BROWSER_TESTS: "1"

    steps:
      - *checkout
      - *python313
      - *uv

      - name: Install dependencies and Chromium
        run: |
          uv sync --locked --all-groups
          uv run playwright install --with-deps chromium

      - name: Run real browser regression tests
        run: uv run pytest -m browser --no-cov

  ai-contracts:
    name: AI / schemas and golden rubric
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.13"

    steps:
      - *checkout
      - *python313
      - *uv

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run deterministic no-key AI contracts
        run: uv run pytest -m ai_contract --no-cov

  security:
    name: Security / source and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      UV_PYTHON: "3.13"

    steps:
      - *checkout
      - *python313
      - *uv

      - name: Scan Python source
        run: uvx bandit --quiet --recursive src

      - name: Audit GitHub Actions definitions
        run: uvx zizmor .github/workflows

      - name: Audit locked Python runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "${RUNNER_TEMP}/requirements.txt"
          uvx pip-audit --requirement "${RUNNER_TEMP}/requirements.txt"

      - name: Reject common committed credential patterns
        shell: bash
        run: |
          if git grep -IEn '(sk-proj-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16})' -- ':!uv.lock'; then
            echo "Potential credential material is committed."
            exit 1
          fi

      - name: Scan repository dependencies, secrets and infrastructure config
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  containers:
    name: Delivery / Compose build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - *checkout

      - name: Create CI environment file and validate Compose
        run: |
          cp .env.example .env
          printf '\nOPENAI_API_KEY=ci-placeholder\n' >> .env
          docker compose config --quiet

      - name: Build API and web images
        run: |
          docker build --check .
          docker build --check web
          docker compose build api web

      - name: Start production-like control plane
        run: docker compose up --detach postgres redis migrate api web

      - name: Wait for API and web health
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/readyz >/dev/null && curl --fail --silent http://localhost:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Verify API schema and hardened preview headers
        run: |
          curl --fail --silent http://localhost:8000/openapi.json | grep --quiet 'Prompt2Play'
          curl --fail --silent --head http://localhost:5173/ | grep --ignore-case --quiet 'x-content-type-options: nosniff'

      - name: Preserve failure logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  ci-success:
    name: CI / required gate
    if: always()
    needs:
      - backend-quality
      - backend-unit
      - frontend
      - integration
      - browser
      - ai-contracts
      - security
      - containers
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS_JSON"]).items()}
          print(json.dumps(results, indent=2, sort_keys=True))
          sys.exit(0 if all(result == "success" for result in results.values()) else 1)
          PY
