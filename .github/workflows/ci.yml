name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Build studio for portable distributions
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build studio
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build

      - name: Build distributions
        run: uv build

      - name: Check wheel installation without repository imports
        run: |
          uv venv "$RUNNER_TEMP/portable-venv"
          uv pip install --python "$RUNNER_TEMP/portable-venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          PROMPT2PLAY_DATA_DIR="$RUNNER_TEMP/portable-data" "$RUNNER_TEMP/portable-venv/bin/prompt2play" manage check

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: prompt2play
      DB_USER: prompt2play
      DB_PASSWORD: ci-local-fixture-password
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: prompt2play
          POSTGRES_USER: prompt2play
          POSTGRES_PASSWORD: ci-local-fixture-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prompt2play"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      # Ubuntu 24.04 includes pg_dump16; the service is PostgreSQL18.
      # Follow https://www.postgresql.org/download/linux/ubuntu/ for signed PGDG packages.
      - name: Install matching PostgreSQL backup clients
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo tee /etc/apt/sources.list.d/prompt2play-pgdg.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Run tests
        run: uv run pytest

      - name: Run adopted provider and worker regressions
        run: uv run python -m unittest discover -s src/prompt2play/legacy/worker/tests -t src

  browser:
    name: Isolated game and creator acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_PYTHON: "3.13"
      P2P_RUN_ISOLATED_BROWSER: "1"
      P2P_BROWSER_EVIDENCE: /tmp/prompt2play-browser-evidence
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --all-groups
      - name: Build isolated validator
        run: uv run prompt2play build-validator
      - name: Execute reviewed game regressions in Docker
        run: uv run pytest tests/test_validation_browser.py --no-cov
      - name: Install studio test dependencies
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install studio packages
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Execute trusted creator flow
        working-directory: web
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/prompt2play-studio.log 2>&1 &
          studio_pid=$!
          trap 'kill "$studio_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:5173/ > /dev/null && break
            sleep 1
          done
          node tests/creator-flow.mjs
