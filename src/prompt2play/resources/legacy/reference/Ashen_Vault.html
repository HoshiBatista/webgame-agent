<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1011">
<title>Пепельный свод — roguelike</title>
</head>
<body>
<noscript>Для запуска игры включите JavaScript в браузере.</noscript>
<!--
ПЕПЕЛЬНЫЙ СВОД. Автономная игра, версия 1.2.
Запуск: сохраните этот файл с расширением .html и откройте в браузере.
Установка, сборщик, сервер, интернет и дополнительные файлы не нужны.
Весь интерфейс, графика, звук и правила создаются единственным скриптом ниже.
WASD/стрелки — шаг и удар; Q — искра; F — кольцо пепла; H — зелье;
E — действие/лестница; Пробел — ожидание; Tab — карта; Esc — меню.
Подробная справка и экспорт/импорт сохранения доступны в меню игры.
-->
<script>
(function () {
'use strict';
/* Ashen Vault — deterministic, DOM-free, turn-based game rules.
 * tiles: 0 wall, 1 floor, 2 stairs. Coordinates and moves are cardinal.
 * Features trigger on stepping onto them; interact also reaches adjacent features.
 * Stairs only trigger via interact while standing on them. Beat floor-five boss,
 * then use its stairs to win. act/choose clear events; event IDs never repeat.
 * A level-up consumes the action but grants respite from that enemy response.
 */
const ASHEN_CLASSES = [
  { id: 'warden', name: 'Страж', desc: 'Крепкая броня, тяжёлый удар. Надёжный путь в глубину.', color: '#e0aa5d', hp: 36, mana: 9, atk: 6, armor: 2, crit: .08, dodge: .03 },
  { id: 'rogue', name: 'Тень', desc: 'Критические удары и уклонение. Уязвим, но смертоносен.', color: '#79cdbb', hp: 29, mana: 11, atk: 5, armor: 1, crit: .25, dodge: .16 },
  { id: 'mage', name: 'Искровед', desc: 'Сильные заклинания и большой запас маны.', color: '#a99be7', hp: 26, mana: 18, atk: 4, armor: 0, crit: .10, dodge: .06 }
];
const ASHEN_SKILLS = [
  { id: 'bolt', name: 'Искра', desc: 'Магический удар по видимому врагу. Броня не защищает.', cost: 3, range: 9 },
  { id: 'nova', name: 'Кольцо пепла', desc: 'Удар по видимым врагам в радиусе 2,5 клеток.', cost: 5, range: 2.5 }
];
const ASHEN_PERKS = [
  { id: 'vitality', name: 'Несгибаемость', desc: '+9 к максимальному здоровью; восстановить 9 HP.' },
  { id: 'strength', name: 'Тяжёлая рука', desc: '+2 к силе всех обычных атак.' },
  { id: 'armor', name: 'Пепельная кожа', desc: '+1 к броне. Каждый удар врага слабее.' },
  { id: 'focus', name: 'Внутренний огонь', desc: '+5 к максимальной мане; восстановить всю ману.' },
  { id: 'sorcery', name: 'Жар углей', desc: '+3 к урону обоих заклинаний.' },
  { id: 'precision', name: 'Верный удар', desc: '+12% к шансу критического удара.' },
  { id: 'evasion', name: 'Лёгкий шаг', desc: '+8% к шансу уклониться от атаки.' },
  { id: 'vampire', name: 'Тлеющее сердце', desc: 'Каждый убитый враг восстанавливает 2 HP.' }
];

class AshenEngine {
  constructor({ seed = String(Date.now()), classId = 'warden' } = {}) {
    const hero = ASHEN_CLASSES.find(c => c.id === classId) || ASHEN_CLASSES[0];
    const seedText = String(seed).slice(0, 200);
    let h = 2166136261;
    for (let i = 0; i < seedText.length; i++) h = Math.imul(h ^ seedText.charCodeAt(i), 16777619);
    this._rng = h >>> 0;
    this._uid = 0;
    this.state = {
      version: 1, seed: seedText, floor: 1, maxFloors: 5, turn: 0, status: 'playing',
      w: 41, h: 29, tiles: [], rooms: [], seen: [], visible: [],
      player: { classId: hero.id, name: hero.name, x: 0, y: 0, hp: hero.hp, maxHp: hero.hp,
        mana: hero.mana, maxMana: hero.mana, atk: hero.atk, armor: hero.armor,
        crit: hero.crit, dodge: hero.dodge, level: 1, xp: 0, xpNext: 18,
        potions: 3, gold: 0, weaponName: hero.id === 'mage' ? 'Угольный посох' : hero.id === 'rogue' ? 'Парные ножи' : 'Старый клинок',
        armorName: hero.id === 'warden' ? 'Кольчуга дозорного' : 'Потрёпанный плащ',
        weaponPower: 0, armorPower: 0, spellPower: hero.id === 'mage' ? 4 : 0, lifesteal: 0, relics: [] },
      enemies: [], features: [], items: [], stairs: { x: 0, y: 0 }, choices: [], log: [], events: [],
      bossDefeated: false, stats: { kills: 0, gold: 0, damageDealt: 0, damageTaken: 0, spells: 0, potionsUsed: 0, floors: 1, chests: 0 }
    };
    this._generateFloor();
    this._log('Пять этажей под пеплом. Найди Владыку углей и выберись живым.', 'info');
    this._log('Двигайся в сторону врага, чтобы атаковать. E — лестница и взаимодействие.', 'info');
  }

  _random() {
    this._rng = (this._rng + 0x6D2B79F5) >>> 0;
    let t = this._rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  _int(a, b) { return a + Math.floor(this._random() * (b - a + 1)); }
  _pick(list) { return list[this._int(0, list.length - 1)]; }
  _id(prefix) { return prefix + (++this._uid); }
  _inside(x, y) { return Number.isInteger(x) && Number.isInteger(y) && x >= 0 && y >= 0 && x < this.state.w && y < this.state.h; }
  _walkable(x, y) { return this._inside(x, y) && this.state.tiles[y][x] !== 0; }
  _distance(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }
  _log(text, kind = 'info') {
    this.state.log.push({ text, kind, turn: this.state.turn });
    if (this.state.log.length > 100) this.state.log.shift();
  }
  _event(type, x, y, more = {}) { this.state.events.push({ id: this._id('ev'), type, x, y, ...more }); }
  _grid(value) { return Array.from({ length: this.state.h }, () => Array(this.state.w).fill(value)); }

  _generateFloor() {
    const s = this.state, p = s.player;
    s.tiles = this._grid(0); s.seen = this._grid(false); s.visible = this._grid(false);
    s.rooms = []; s.enemies = []; s.features = []; s.items = []; s.choices = [];
    const carve = (x, y) => { if (x > 0 && y > 0 && x < s.w - 1 && y < s.h - 1) s.tiles[y][x] = 1; };
    for (let attempt = 0; attempt < 220 && s.rooms.length < 10; attempt++) {
      const w = this._int(5, 9), h = this._int(4, 7);
      const x = this._int(2, s.w - w - 2), y = this._int(2, s.h - h - 2);
      if (s.rooms.some(r => x <= r.x + r.w && x + w >= r.x && y <= r.y + r.h && y + h >= r.y)) continue;
      const room = { x, y, w, h, cx: x + Math.floor(w / 2), cy: y + Math.floor(h / 2) };
      for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) carve(xx, yy);
      if (s.rooms.length) {
        const prev = s.rooms[s.rooms.length - 1];
        let xx = prev.cx, yy = prev.cy;
        if (this._random() < .5) {
          while (xx !== room.cx) { carve(xx, yy); xx += Math.sign(room.cx - xx); }
          while (yy !== room.cy) { carve(xx, yy); yy += Math.sign(room.cy - yy); }
        } else {
          while (yy !== room.cy) { carve(xx, yy); yy += Math.sign(room.cy - yy); }
          while (xx !== room.cx) { carve(xx, yy); xx += Math.sign(room.cx - xx); }
        }
        carve(xx, yy);
      }
      s.rooms.push(room);
    }
    const first = s.rooms[0];
    p.x = first.cx; p.y = first.cy;
    const distances = this._distances(p.x, p.y);
    let finalRoom = first, farthest = -1;
    for (const room of s.rooms) {
      const d = distances[room.cy][room.cx];
      if (d > farthest) { farthest = d; finalRoom = room; }
    }
    s.stairs = { x: finalRoom.cx, y: finalRoom.cy };
    s.tiles[s.stairs.y][s.stairs.x] = 2;
    const cells = [];
    for (let y = 1; y < s.h - 1; y++) for (let x = 1; x < s.w - 1; x++) {
      if (s.tiles[y][x] === 1 && !(x === p.x && y === p.y)) cells.push({ x, y });
    }
    const used = new Set([p.x + ',' + p.y, s.stairs.x + ',' + s.stairs.y]);
    const spot = (minDistance = 0, room = null) => {
      let candidates = cells.filter(c => !used.has(c.x + ',' + c.y) && distances[c.y][c.x] >= minDistance && (!room || (c.x >= room.x && c.x < room.x + room.w && c.y >= room.y && c.y < room.y + room.h)));
      if (!candidates.length) candidates = cells.filter(c => !used.has(c.x + ',' + c.y));
      const c = this._pick(candidates);
      if (!c) return null;
      used.add(c.x + ',' + c.y); return { ...c };
    };
    if (s.floor === 5) {
      const pos = spot(0, finalRoom);
      if (pos) s.enemies.push(this._makeEnemy('boss', pos.x, pos.y));
    }
    const count = 6 + s.floor * 2;
    for (let i = 0; i < count; i++) {
      const pos = spot(8);
      if (!pos) break;
      const pool = s.floor === 1 ? ['rat', 'rat', 'skeleton', 'skeleton', 'archer'] : ['rat', 'skeleton', 'skeleton', 'archer', 'sentinel', 'bomber'];
      s.enemies.push(this._makeEnemy(this._pick(pool), pos.x, pos.y));
    }
    for (const type of ['chest', 'chest', 'chest', 'shrine', 'fountain']) {
      const pos = spot(4);
      if (pos) s.features.push({ id: this._id('f'), type, ...pos, used: false });
    }
    for (const type of ['potion', 'potion', 'mana', 'weapon', 'armor', 'gold', 'gold']) {
      const pos = spot(3);
      if (pos) s.items.push(this._makeItem(type, pos.x, pos.y));
    }
    this._updateFov();
    this._event('floor', p.x, p.y, { text: s.floor === 5 ? 'Престол углей' : 'Этаж ' + s.floor });
  }

  _makeEnemy(type, x, y) {
    const f = this.state.floor - 1;
    const defs = {
      rat: { name: 'Пепельная крыса', hp: 8, atk: 3, armor: 0, xp: 5, color: '#b3a281' },
      skeleton: { name: 'Костяной страж', hp: 13, atk: 4, armor: 0, xp: 8, color: '#d5c9b3' },
      archer: { name: 'Тлеющий лучник', hp: 11, atk: 4, armor: 0, xp: 9, color: '#cc9b72' },
      sentinel: { name: 'Железный дозор', hp: 23, atk: 5, armor: 2, xp: 13, color: '#98a6ac' },
      bomber: { name: 'Пороховой дух', hp: 10, atk: 8, armor: 0, xp: 10, color: '#f6a34c' },
      boss: { name: 'Владыка углей', hp: 100, atk: 8, armor: 2, xp: 50, color: '#f17862' }
    };
    const d = defs[type];
    const hp = d.hp + (type === 'boss' ? 0 : f * 3);
    return { id: this._id('e'), type, name: d.name, x, y, hp, maxHp: hp,
      atk: d.atk + (type === 'boss' ? 0 : Math.floor(f * .65)), armor: d.armor,
      xp: d.xp + f, color: d.color, alert: 0, armed: false, intent: null, charge: 0, actions: 0 };
  }
  _makeItem(type, x, y) {
    const f = this.state.floor;
    const item = { id: this._id('i'), type, x, y };
    if (type === 'gold') { item.amount = this._int(5, 10) + f * 3; item.name = 'Золото'; }
    if (type === 'potion') { item.amount = 1; item.name = 'Лечебное зелье'; }
    if (type === 'mana') { item.amount = 5; item.name = 'Осколок эфира'; }
    if (type === 'weapon') { item.power = f + this._int(0, 2); item.name = this._pick(['Угольный клинок', 'Серп дозорного', 'Шип пламени', 'Обсидиановый меч']) + ' +' + item.power; }
    if (type === 'armor') { item.power = Math.ceil(f / 2) + this._int(0, 1); item.name = this._pick(['Пепельный панцирь', 'Броня изгнанника', 'Кольчуга углей']) + ' +' + item.power; }
    return item;
  }

  _line(x0, y0, x1, y1) {
    // Bresenham's tie-break chooses different cells when traversed backward.
    // Use one canonical direction so FOV, targeting, and enemy sight agree.
    if (x0 > x1 || (x0 === x1 && y0 > y1)) {
      [x0, x1] = [x1, x0]; [y0, y1] = [y1, y0];
    }
    let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy;
    while (!(x0 === x1 && y0 === y1)) {
      const e = 2 * err, oldX = x0, oldY = y0;
      if (e > -dy) { err -= dy; x0 += sx; }
      if (e < dx) { err += dx; y0 += sy; }
      if (x0 !== oldX && y0 !== oldY && !this._walkable(x0, oldY) && !this._walkable(oldX, y0)) return false;
      if (x0 === x1 && y0 === y1) return true;
      if (!this._walkable(x0, y0)) return false;
    }
    return true;
  }
  _updateFov() {
    const s = this.state, p = s.player;
    s.visible = this._grid(false);
    for (let y = Math.max(0, p.y - 9); y <= Math.min(s.h - 1, p.y + 9); y++) {
      for (let x = Math.max(0, p.x - 9); x <= Math.min(s.w - 1, p.x + 9); x++) {
        if ((x - p.x) ** 2 + (y - p.y) ** 2 <= 81 && this._line(p.x, p.y, x, y)) s.visible[y][x] = s.seen[y][x] = true;
      }
    }
    s.visible[p.y][p.x] = s.seen[p.y][p.x] = true;
  }
  _distances(x, y) {
    const d = this._grid(-1), queue = [{ x, y }]; d[y][x] = 0;
    for (let i = 0; i < queue.length; i++) {
      const c = queue[i];
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = c.x + dx, ny = c.y + dy;
        if (this._walkable(nx, ny) && d[ny][nx] < 0) { d[ny][nx] = d[c.y][c.x] + 1; queue.push({ x: nx, y: ny }); }
      }
    }
    return d;
  }

  act(action) {
    const s = this.state, p = s.player;
    s.events = [];
    if (!action || typeof action !== 'object' || s.status !== 'playing') return false;
    let consumed = false, changedFloor = false;
    if (action.type === 'move') {
      const { dx, dy } = action;
      if (!Number.isInteger(dx) || !Number.isInteger(dy) || Math.abs(dx) + Math.abs(dy) !== 1) return false;
      const x = p.x + dx, y = p.y + dy;
      if (!this._walkable(x, y)) return false;
      const enemy = s.enemies.find(e => e.x === x && e.y === y);
      if (enemy) this._melee(enemy);
      else {
        const fromX = p.x, fromY = p.y; p.x = x; p.y = y;
        this._event('step', x, y, { tx: fromX, ty: fromY });
        this._pickup();
        const feature = s.features.find(f => f.x === x && f.y === y && !f.used);
        if (feature) this._useFeature(feature);
        if (s.tiles[y][x] === 2) this._log(s.floor < 5 ? 'Лестница вниз. Нажми E, когда будешь готов.' : s.bossDefeated ? 'Путь наружу открыт. Нажми E.' : 'Выход запечатан. Владыка углей ещё жив.', 'info');
      }
      consumed = true;
    } else if (action.type === 'wait') {
      p.mana = Math.min(p.maxMana, p.mana + 1);
      if (!s.enemies.some(e => this._distance(e, p) <= 6) && s.turn % 2 === 0) p.hp = Math.min(p.maxHp, p.hp + 1);
      consumed = true;
    } else if (action.type === 'potion') {
      if (p.potions < 1 || p.hp >= p.maxHp) { this._log(p.potions < 1 ? 'Нет лечебных зелий.' : 'Здоровье уже восстановлено.', 'info'); return false; }
      p.potions--; s.stats.potionsUsed++;
      this._heal(Math.ceil(p.maxHp * .55) + 4);
      this._log('Лечебное зелье согревает кровь.', 'good'); consumed = true;
    } else if (action.type === 'cast') {
      const skill = ASHEN_SKILLS.find(a => a.id === action.skill);
      if (!skill) return false;
      if (p.mana < skill.cost) { this._log('Не хватает маны. Ожидание восстанавливает силы.', 'info'); return false; }
      if (skill.id === 'bolt') {
        const { x, y } = action;
        if (!this._inside(x, y) || !s.visible[y][x] || (x - p.x) ** 2 + (y - p.y) ** 2 > skill.range ** 2 || !this._line(p.x, p.y, x, y)) return false;
        const enemy = s.enemies.find(e => e.x === x && e.y === y);
        if (!enemy) { this._log('Искре нужна видимая цель.', 'info'); return false; }
        p.mana -= skill.cost;
        this._event('cast', p.x, p.y, { tx: x, ty: y, text: 'bolt', color: '#b8a5ff' });
        this._hurtEnemy(enemy, 9 + p.spellPower + Math.floor(p.level / 2), true);
      } else {
        const targets = s.enemies.filter(e => (e.x - p.x) ** 2 + (e.y - p.y) ** 2 <= 6.25 && this._line(p.x, p.y, e.x, e.y));
        if (!targets.length) { this._log('Рядом нет врагов для кольца пепла.', 'info'); return false; }
        p.mana -= skill.cost;
        this._event('cast', p.x, p.y, { text: 'nova', color: '#d7b4ff' });
        for (const enemy of targets) this._hurtEnemy(enemy, 8 + p.spellPower + Math.floor(p.level / 2), true);
      }
      s.stats.spells++; consumed = true;
    } else if (action.type === 'interact') {
      if (p.x === s.stairs.x && p.y === s.stairs.y) {
        if (s.floor === 5) {
          if (!s.bossDefeated) { this._log('Печать держится силой Владыки углей.', 'danger'); return false; }
          s.status = 'won';
          this._log('Пепельный свод остался позади. Ты вынес свет на поверхность.', 'good');
          this._event('floor', p.x, p.y, { text: 'Свобода', color: '#efd297' }); consumed = true;
        } else {
          s.floor++; s.stats.floors = s.floor;
          p.hp = Math.min(p.maxHp, p.hp + Math.ceil(p.maxHp * .3)); p.mana = p.maxMana;
          this._generateFloor();
          this._log('Этаж ' + s.floor + '. На лестнице ты перевёл дыхание и восстановил ману.', 'good');
          consumed = true; changedFloor = true;
        }
      } else {
        const candidates = s.features.filter(f => !f.used && this._distance(f, p) <= 1).sort((a, b) => this._distance(a, p) - this._distance(b, p));
        const feature = candidates.find(f => f.type !== 'fountain' || p.hp < p.maxHp || p.mana < p.maxMana);
        if (!feature || !this._useFeature(feature)) return false;
        consumed = true;
      }
    }
    if (!consumed) return false;
    s.turn++;
    if (s.turn % 5 === 0) p.mana = Math.min(p.maxMana, p.mana + 1);
    this._updateFov();
    if (s.status === 'playing' && !changedFloor && !this._levelUp()) this._enemyTurn();
    this._updateFov();
    return true;
  }

  _melee(enemy) {
    const p = this.state.player, critical = this._random() < p.crit;
    let damage = p.atk + this._int(-1, 1);
    if (critical) damage = Math.ceil(damage * 1.7);
    this._hurtEnemy(enemy, damage, false, critical);
  }
  _hurtEnemy(enemy, amount, magic = false, critical = false) {
    if (!this.state.enemies.includes(enemy)) return;
    const s = this.state, damage = Math.max(1, amount - (magic ? 0 : enemy.armor));
    enemy.hp -= damage; enemy.alert = 9; s.stats.damageDealt += damage;
    this._event('hit', enemy.x, enemy.y, { amount: damage, text: critical ? 'КРИТ' : '', color: critical ? '#ffdc85' : magic ? '#bba2ff' : '#fff0d0' });
    this._log((critical ? 'Критический удар! ' : '') + enemy.name + ': −' + damage + ' HP.', magic ? 'magic' : 'combat');
    if (enemy.hp <= 0) this._killEnemy(enemy);
  }
  _killEnemy(enemy) {
    const s = this.state, p = s.player;
    s.enemies = s.enemies.filter(e => e.id !== enemy.id);
    s.stats.kills++; p.xp += enemy.xp;
    this._event('death', enemy.x, enemy.y, { text: enemy.type, color: enemy.color });
    this._log(enemy.name + ' повержен. +' + enemy.xp + ' опыта.', 'good');
    if (p.lifesteal) this._heal(p.lifesteal);
    if (enemy.type === 'boss') {
      s.bossDefeated = true; p.relics.push('Сердце углей');
      p.gold += 100; s.stats.gold += 100;
      this._log('Владыка пал. Печать разрушена — найди лестницу и нажми E!', 'good');
      this._heal(Math.ceil(p.maxHp * .3));
    } else {
      if (this._random() < .7) s.items.push(this._makeItem('gold', enemy.x, enemy.y));
      if (this._random() < .14) s.items.push(this._makeItem('potion', enemy.x, enemy.y));
    }
  }
  _hurtPlayer(amount, source, magic = false) {
    const s = this.state, p = s.player;
    if (s.status !== 'playing') return;
    if (!magic && this._random() < p.dodge) {

function randomSeed(){
  try{const data=new Uint32Array(1);crypto.getRandomValues(data);return data[0].toString(36).toUpperCase();}catch(_){return(Date.now().toString(36)+Math.random().toString(36).slice(2,5)).toUpperCase();}
}

function requestNewRun(){

function startRun(){

function saveRun(){

function loadRun(text=null){

function closeHelp(){const previous=returnScreen;returnScreen='';if(previous==='title')showTitle();else if(previous==='pause')showPause();else if(previous==='end')showEnd();else resumeGame();}

function showChoice(){
  if(!engine||engine.state.status!=='choice'){resumeGame();return;}
  setScreen('choice');const s=engine.state;

function choosePerk(id){
  if(!engine||engine.state.status!=='choice')return;
  if(engine.choose(id)){renderer.pushEvents(engine.state.events||[]);sound.play('level');saveRun();if(engine.state.status==='choice')showChoice();else setScreen('');renderHUD();}

function runScore(s){return (s.stats.kills||0)*50+(s.player.gold||0)+(s.floor-1)*300+(s.player.level-1)*120+(s.status==='won'?2000:0);}
function recordEnd(){
  if(!engine||finishedRecorded)return;const s=engine.state;finishedRecorded=true;records.runs++;if(s.status==='won')records.wins++;records.bestFloor=Math.max(records.bestFloor,s.floor);records.bestScore=Math.max(records.bestScore,runScore(s));storage.set(ASHEN_RECORD_KEY,JSON.stringify(records));storage.remove(ASHEN_SAVE_KEY);
}

function showEnd(){
  if(!engine){showTitle();return;}const s=engine.state;if(!['dead','won'].includes(s.status)){resumeGame();return;}recordEnd();setScreen('end');const win=s.status==='won';
  overlay.innerHTML=`<section class="ash-dialog"><p class="ash-kicker">${win?'Свет возвращается':'Поход завершён'}</p><h2>${win?'Вы вынесли огонь.':'Искра погасла.'}</h2><p class="lead">${win?'Владыка углей пал. Под сводом впервые за сотню лет наступила тишина. Вы нашли дорогу на поверхность — и принесли с собой рассвет.':'Свод запомнил ваши шаги. Следующий герой найдёт другие проходы, другие дары и свой путь сквозь тьму.'}</p><div class="ash-result-grid"><div><b>${s.floor}<small style="font-size:15px;color:#7e916f"> / 5</small></b><span>Глубина</span></div><div><b>${s.stats.kills||0}</b><span>Врагов повержено</span></div><div><b>${runScore(s)}</b><span>Счёт похода</span></div></div><p class="lead" style="font-size:11px">${escapeHTML(s.player.name||currentClass().name)} · уровень ${s.player.level} · ${s.turn} ходов · ${s.player.gold} золота<br>Семя: ${escapeHTML(s.seed)}</p><div class="ash-dialog-actions"><button class="ash-primary" data-action="title">Новый странник <span aria-hidden="true">→</span></button><button class="ash-secondary" data-action="retry">Повторить то же семя</button></div></section>`;
}

function exportSave(){
  if(!engine||!['playing','choice'].includes(engine.state.status)){toast('Сначала начните поход.');return;}
  const blob=new Blob([engine.serialize()],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`ashen-vault-${String(engine.state.seed).replace(/[^a-zA-Z0-9_-]/g,'_')}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Сохранение выгружено. Его можно открыть через меню игры.');
}

function processEvents(events){
  renderer.pushEvents(events||[]);let played=0;for(const e of events||[]){if(played>=4)break;if(e.type==='step'&&events.length>1)continue;sound.play(e.type);played++;}
}

function perform(action,automatic=false){
  if(!engine||screen||engine.state.status!=='playing')return false;
  if(!automatic)moveQueue=[];sound.init();
  const beforeFloor=engine.state.floor;const acted=engine.act(action);const s=engine.state;processEvents(s.events||[]);
  if(s.floor!==beforeFloor){renderer.reset();selectedTarget=null;hoverTile=null;mapMode=false;moveQueue=[];toast(`${ASHEN_ROMAN[s.floor-1]}. ${ASHEN_FLOORS[s.floor-1]}`);}
  if(selectedTarget&&!s.enemies.some(e=>e.id===selectedTarget&&e.hp>0))selectedTarget=null;
  if(s.status==='choice'){moveQueue=[];showChoice();}
  else if(s.status==='won'||s.status==='dead'){moveQueue=[];recordEnd();endedAt=performance.now()+600;if(s.status==='won')sound.play('win');}
  if(acted)saveRun();else if(s.log&&s.log.length)toast(s.log[s.log.length-1].text);
  renderHUD();return acted;
}

function castBolt(){
  if(!engine||screen)return;const s=engine.state,p=s.player;const candidates=visibleEnemies(s).filter(e=>Math.hypot(e.x-p.x,e.y-p.y)<=9).sort((a,b)=>(Math.abs(a.x-p.x)+Math.abs(a.y-p.y))-(Math.abs(b.x-p.x)+Math.abs(b.y-p.y)));
  const target=candidates.find(e=>e.id===selectedTarget)||candidates[0];if(!target){toast('Искре нужна видимая цель.');return;}selectedTarget=target.id;perform({type:'cast',skill:'bolt',x:target.x,y:target.y});
}

function knownPath(s,target){
  const p=s.player;const key=(x,y)=>y*s.w+x;const origin=key(p.x,p.y),dest=key(target.x,target.y);const queue=[origin],prev=new Map([[origin,null]]);const occupied=new Set((s.enemies||[]).filter(e=>e.hp>0).map(e=>key(e.x,e.y)));
  for(let i=0;i<queue.length;i++){const cur=queue[i];if(cur===dest)break;const x=cur%s.w,y=Math.floor(cur/s.w);for(const [dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){const nx=x+dx,ny=y+dy,n=key(nx,ny);if(nx<0||ny<0||nx>=s.w||ny>=s.h||prev.has(n)||!s.seen[ny][nx]||s.tiles[ny][nx]===0||occupied.has(n))continue;prev.set(n,cur);queue.push(n);}}
  if(!prev.has(dest))return[];const path=[];let current=dest;while(current!==origin){path.push({x:current%s.w,y:Math.floor(current/s.w)});current=prev.get(current);}return path.reverse();
}

function clickWorld(event){
  if(!engine||screen||engine.state.status!=='playing')return;const tile=renderer.hitTest(event.clientX,event.clientY);if(!tile)return;const s=engine.state,p=s.player;
  if(!s.seen[tile.y]||!s.seen[tile.y][tile.x]){toast('Эта часть свода ещё скрыта.');return;}
  const enemy=s.enemies.find(e=>e.hp>0&&e.x===tile.x&&e.y===tile.y&&s.visible[e.y][e.x]);
  if(enemy){selectedTarget=enemy.id;if(Math.abs(enemy.x-p.x)+Math.abs(enemy.y-p.y)===1)perform({type:'move',dx:enemy.x-p.x,dy:enemy.y-p.y});else toast(`${enemy.name}: цель для Искры выбрана. Нажмите Q.`);updateHover(tile);return;}
  if(tile.x===p.x&&tile.y===p.y){perform({type:'interact'});return;}
  if(Math.abs(tile.x-p.x)+Math.abs(tile.y-p.y)===1){perform({type:'move',dx:tile.x-p.x,dy:tile.y-p.y});return;}
  if(visibleEnemies(s).length){toast('Враг рядом. Выбирайте соседние клетки или двигайтесь клавишами.');return;}
  const path=knownPath(s,tile);if(!path.length){toast('Нет исследованного пути к этой клетке.');return;}moveQueue=path;nextAutoStep=0;sound.init();
}

function updateHover(tile){
  hoverTile=tile;const box=$('ash-hover');if(!engine||screen||!tile){box.hidden=true;return;}const s=engine.state;if(!s.visible[tile.y]||!s.visible[tile.y][tile.x]){box.hidden=true;return;}
  const enemy=s.enemies.find(e=>e.x===tile.x&&e.y===tile.y&&e.hp>0);if(enemy){box.innerHTML=`<b>${escapeHTML(enemy.name)}</b><span>${enemy.hp}/${enemy.maxHp} жизни · атака ${enemy.atk} · броня ${enemy.armor||0}${enemy.intent?'<br>Готовит сильную атаку!':''}</span>`;box.className='ash-hover danger';box.hidden=false;return;}
  const f=s.features.find(f=>f.x===tile.x&&f.y===tile.y&&!f.used);if(f){const names={chest:'Древний сундук',fountain:'Последняя вода',shrine:'Святилище искры'};box.innerHTML=`<b>${names[f.type]||'Находка'}</b><span>Подойдите или нажмите E рядом.</span>`;box.className='ash-hover';box.hidden=false;return;}box.hidden=true;
}

function toggleMap(){if(!engine||screen)return;mapMode=!mapMode;moveQueue=[];toast(mapMode?'Исследованная карта. Tab — вернуться к герою.':'Следуем за искрой.');}

function onAction(action){
  if(action==='new'){requestNewRun();return;}if(action==='start-confirmed'){startRun();return;}if(action==='cancel-confirm'){if(returnScreen==='title')showTitle();else resumeGame();return;}
  if(action==='load'){loadRun();return;}if(action==='sound'){toggleSound();return;}if(action==='music'){toggleMusic();return;}if(action==='help'){showHelp();return;}if(action==='close-help'){closeHelp();return;}
  if(action==='pause'){if(screen==='pause')resumeGame();else if(screen==='help')closeHelp();else showPause();return;}if(action==='resume'){resumeGame();return;}
  if(action==='title'){if(engine&&['playing','choice'].includes(engine.state.status))saveRun();lastSeed='';showTitle();return;}
  if(action==='retry'){if(engine){lastSeed=engine.state.seed;selectedClass=engine.state.player.classId;}startRun();return;}
  if(action==='motion'){preferences.reduceMotion=!preferences.reduceMotion;storage.set(ASHEN_PREF_KEY,JSON.stringify(preferences));showPause();return;}
  if(action==='export'){exportSave();return;}if(action==='import'){$('ash-import').click();return;}
  if(action==='fullscreen'){try{if(document.fullscreenElement){const exit=document.exitFullscreen();if(exit&&exit.catch)exit.catch(()=>{});}else if(root.requestFullscreen){const req=root.requestFullscreen();if(req&&req.catch)req.catch(()=>toast('Откройте игру в отдельном окне браузера.'));}else toast('Используйте полноэкранный режим вашего браузера.');}catch(_){toast('Используйте полноэкранный режим вашего браузера.');}return;}
  if(action==='map'){toggleMap();return;}if(screen)return;
  if(action==='bolt')castBolt();else if(action==='nova')perform({type:'cast',skill:'nova'});else if(['wait','potion','interact'].includes(action))perform({type:action});
}

root.addEventListener('click',event=>{
  const button=event.target.closest('button');if(!button||!root.contains(button)||button.disabled)return;
  sound.init();
  if(button.dataset.class){const field=$('ash-seed-input');if(field)lastSeed=field.value;selectedClass=button.dataset.class;showTitle();return;}
  if(button.dataset.choice){choosePerk(button.dataset.choice);return;}
  if(button.dataset.move){const [dx,dy]=button.dataset.move.split(',').map(Number);perform({type:'move',dx,dy});return;}
  if(button.dataset.action)onAction(button.dataset.action);
});
root.addEventListener('input',event=>{
  if(event.target.id!=='ash-music-volume')return;
  preferences.musicVolume=clampUI(Number(event.target.value)/100,0,1);
  const output=$('ash-music-volume-value');if(output)output.textContent=Math.round(preferences.musicVolume*100)+'%';
  sound.init();sound.updateMusic();
});
root.addEventListener('change',event=>{if(event.target.id==='ash-music-volume')storage.set(ASHEN_PREF_KEY,JSON.stringify(preferences));});

canvas.addEventListener('click',clickWorld);
canvas.addEventListener('pointermove',event=>{if(event.pointerType==='touch')return;updateHover(renderer.hitTest(event.clientX,event.clientY));});
canvas.addEventListener('pointerleave',()=>updateHover(null));
$('ash-minimap').addEventListener('click',toggleMap);
$('ash-import').addEventListener('change',async event=>{const file=event.target.files&&event.target.files[0];if(!file)return;try{if(file.size>1024*1024){toast('Этот файл слишком велик для сохранения игры.');return;}loadRun(await file.text());}catch(_){toast('Не удалось прочитать файл.');}finally{event.target.value='';}});

document.addEventListener('keydown',event=>{
  const tag=event.target&&event.target.tagName;if(event.ctrlKey||event.metaKey||event.altKey)return;
  if(event.code==='Escape'){sound.init();event.preventDefault();if(screen==='help')closeHelp();else if(screen==='confirm'){if(returnScreen==='title')showTitle();else resumeGame();}else if(screen==='pause')resumeGame();else if(!screen)showPause();return;}
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  sound.init();
  if(screen==='choice'&&/^Digit[123]$/.test(event.code)){event.preventDefault();const c=engine.state.choices[Number(event.code.slice(-1))-1];if(c)choosePerk(c.id);return;}
  if(screen==='title'&&event.code==='Enter'&&event.target===document.body){event.preventDefault();requestNewRun();return;}
  if(screen)return;
  if(event.code==='Tab'){event.preventDefault();if(!event.repeat)toggleMap();return;}
  if(event.code==='Slash'||event.code==='F1'){event.preventDefault();showHelp();return;}
  const movement={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
  if(movement[event.code]){event.preventDefault();const now=performance.now();if(event.repeat&&now-lastInputTime<120)return;lastInputTime=now;const[dx,dy]=movement[event.code];perform({type:'move',dx,dy});return;}
  const keys={Space:'wait',Period:'wait',KeyQ:'bolt',KeyF:'nova',KeyH:'potion',KeyE:'interact',KeyM:'sound'};
  if(keys[event.code]){event.preventDefault();if(event.repeat)return;onAction(keys[event.code]);}
});
window.addEventListener('pagehide',()=>{saveRun();sound.setPageActive(false);});
window.addEventListener('pageshow',()=>sound.setPageActive(true));
document.addEventListener('visibilitychange',()=>{moveQueue=[];if(document.hidden){saveRun();if(engine&&!screen&&engine.state.status==='playing')showPause();}else if(sound.ctx)sound.init();sound.updateMusic();});

function frame(time){
  if(!document.hidden&&time-lastFrame>=1000/60){
    lastFrame=time;const s=engine?engine.state:demo&&demo.state;
    if(s){const selected=selectedTarget&&s.enemies.find(e=>e.id===selectedTarget&&e.hp>0);renderer.draw(s,time,{mapMode:screen==='title'&&!engine?true:mapMode,paused:!!screen,hover:selected?{x:selected.x,y:selected.y}:hoverTile,reduceMotion:!!preferences.reduceMotion});}
    if(endedAt&&time>=endedAt){endedAt=0;showEnd();}
    if(moveQueue.length&&time>=nextAutoStep&&engine&&!screen&&engine.state.status==='playing'){
      const s=engine.state;if(visibleEnemies(s).length){moveQueue=[];toast('Обнаружен враг. Дальше — по одному ходу.');}else{const next=moveQueue.shift(),dx=next.x-s.player.x,dy=next.y-s.player.y;if(Math.abs(dx)+Math.abs(dy)===1){if(!perform({type:'move',dx,dy},true))moveQueue=[];}else moveQueue=[];nextAutoStep=time+160;}
    }
    if(toastUntil&&time>toastUntil){$('ash-toast').classList.remove('show');toastUntil=0;}
    sound.updateMusic();
  }
  requestAnimationFrame(frame);
}

try{
  demo=new AshenEngine({seed:'THE-LAST-EMBER',classId:'warden'});
  for(let y=0;y<demo.state.h;y++)for(let x=0;x<demo.state.w;x++){demo.state.seen[y][x]=true;demo.state.visible[y][x]=true;}
}catch(err){console.error('Не удалось создать демонстрационное подземелье.',err);}
updateSoundButton();showTitle();renderHUD();requestAnimationFrame(frame);
if(window.__ASHEN_TEST_MODE__){window.__ASHEN_TEST__={startRun,perform,showPause,resumeGame,showHelp,closeHelp,showTitle,choosePerk,loadRun,castBolt,onAction,clickWorld,frame,getEngine:()=>engine,getScreen:()=>screen,renderer,root,sound,getPreferences:()=>({...preferences})};}

})();
</script>
</body>
</html>
