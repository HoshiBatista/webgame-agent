upstream prompt2play_api {
  server api:8000;
  keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=generation:10m rate=10r/m;

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $forwarded_proto $hsts_header {
  https "max-age=31536000; includeSubDomains";
  default "";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 32k;
  limit_req_status 429;

  add_header Strict-Transport-Security $hsts_header always;

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  }

  location = /v1/projects {
    limit_req zone=generation burst=5 nodelay;
    proxy_pass http://prompt2play_api;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
  }

  location ~ ^/v1/revisions/[0-9a-f-]+/revise$ {
    limit_req zone=generation burst=3 nodelay;
    proxy_pass http://prompt2play_api;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
  }

  location /v1/ {
    limit_req zone=api_general burst=60 nodelay;
    proxy_pass http://prompt2play_api;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /play/ {
    proxy_pass http://prompt2play_api;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
  }

  location ~ ^/(healthz|readyz|openapi\.json|docs|redoc)$ {
    proxy_pass http://prompt2play_api;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
}
