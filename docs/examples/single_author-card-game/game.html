</style></head><body><main id="game-root"></main><script>/* Prompt2Play trusted runtime v1. Mechanics and rendering remain in game.js. */
(() => {

  const VERSION = "runtime-v1.0.3";

    const restart = root.querySelector("#p2p-restart");
    const status = root.querySelector("#p2p-status");

        };

      };

        root: surface, spec: copy(spec), random: rng(seed), seed,
        cleanup, active,
        input: {
          on,
          key(callback) { return on(document, "keydown", event => { if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault(); callback(event.key, event); }); },
          pointer(target, callback) { return on(target, "pointerdown", event => { event.preventDefault(); surface.focus({preventScroll: true}); const box = target.getBoundingClientRect(); callback({x: event.clientX - box.left, y: event.clientY - box.top, width: box.width, height: box.height, pointerType: event.pointerType}, event); }); },
        },
        resize(callback) {
          const observer = new ResizeObserver(() => { if (active()) callback(surface.clientWidth, surface.clientHeight, window.devicePixelRatio || 1); });
          observer.observe(surface); cleanup(() => observer.disconnect());
          callback(surface.clientWidth, surface.clientHeight, window.devicePixelRatio || 1);
        },
      };

        let frame = 0, last = 0, accumulator = 0, paused = true, manual = false, tick = 0, callback = null, step = 1 / 60;
        const advance = count => { if (!active() || hidden || paused || !callback) return; for (let i = 0; i < Math.min(600, Math.max(0, count)); i++) { callback(step); tick++; } syncStatus(); };
        const loop = now => {

            let catchup = 0;
            while (accumulator >= step && catchup++ < 8) { advance(1); accumulator -= step; }

          resume() { if (active()) { paused = false; last = 0; accumulator = 0; } },
          setManualMode(enabled) { manual = Boolean(enabled); last = 0; accumulator = 0; },

            oscillator.connect(gain); gain.connect(audio.destination); oscillator.start(); oscillator.stop(audio.currentTime + duration);
            oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
          },

        };

        cleanup(() => { activation++; if (audio) audio.close().catch(() => {}); audio = null; });
      }

        const namespace = "prompt2play:" + spec.title + ":v1";
        context.storage = {
          load() { try { const raw = localStorage.getItem(namespace); return raw ? JSON.parse(raw) : null; } catch (_) { return null; } },
          save(data) { if (!active()) return false; try { const text = JSON.stringify(data); if (text.length > 64000) return false; localStorage.setItem(namespace, text); return true; } catch (_) { return false; } },
          export(data) { return JSON.stringify(data); },
          import(text) { if (typeof text !== "string" || text.length > 64000) throw new Error("Invalid save bytes"); return JSON.parse(text); },
        };
      }
      instance = factory(context);
      if (!instance || typeof instance.snapshot !== "function" || typeof instance.dispatch !== "function") throw new Error("Game factory must return snapshot() and dispatch(action)");
      status.textContent = "Ready";
    }
    function begin() {
      if (!session || !session.alive) return;
      started = true; surface.focus({preventScroll: true}); status.textContent = "Playing";
      if (session.audio) session.audio.activate();
      if (session.clock) session.clock.resume();
      instance.dispatch({type: "START"});
      syncStatus();
    }
    start.addEventListener("click", begin);
    const restartGame = () => { create(seed); begin(); };
    restart.addEventListener("click", restartGame);
    const visibility = () => { hidden = document.hidden; if (session && session.clock) { if (hidden) session.clock.pause(); else if (started) session.clock.resume(); } if (instance && instance.pause) instance.pause(hidden); };
    document.addEventListener("visibilitychange", visibility);
    create(seed);
    const surfaceObserver = new MutationObserver(syncStatus);
    surfaceObserver.observe(surface, {childList: true, characterData: true, attributes: true, subtree: true});

      version: 1,
      identity: Object.freeze({version: VERSION, runtimeDigest: spec.runtime ? spec.runtime.sha256 : null}),
      reset(nextSeed) { create(nextSeed === undefined ? "default" : nextSeed); begin(); return this.snapshot(); },
      snapshot() { syncStatus(); return copy(instance.snapshot()); },
      dispatch(action) { if (!started) begin(); instance.dispatch(copy(action)); syncStatus(); return this.snapshot(); },
      getState() { return this.snapshot(); }, getViewState() { return this.snapshot(); },
      advance(count) { if (session.clock) session.clock.advance(count); return this.snapshot(); },
      setManualMode(enabled) { if (session.clock) session.clock.setManualMode(enabled); },
      exportSave() { if (!capabilities.has("storage") || typeof instance.exportSave !== "function") throw new Error("Game save export unavailable"); return instance.exportSave(); },
      importSave(text) { if (!capabilities.has("storage") || typeof instance.importSave !== "function") throw new Error("Game save import unavailable"); const result = instance.importSave(text); syncStatus(); return typeof result === "boolean" ? {ok: result} : result; },
      diagnostics() { return {runtime: VERSION, started, hidden, disposed, input_events: session.eventCount, capabilities: [...capabilities], controls: spec.input_acceptance || null, audio: session.audio ? session.audio.diagnostics : null}; },
      dispose() { if (disposed) return; teardown(); disposed = true; surfaceObserver.disconnect(); document.removeEventListener("visibilitychange", visibility); start.removeEventListener("click", begin); restart.removeEventListener("click", restartGame); },
    });

    return bridge;
  }
  Object.defineProperty(window, "Prompt2PlayRuntime", {value: Object.freeze({version: VERSION, install}), writable: false, configurable: false});
})();

function createGame(ctx) {
  const root = ctx.root;
  let state;
  const reset = () => {
    state = { phase: 'ready', roundsPlayed: 0, playerRemaining: [1,2,3], botRemaining: [1,2,3], botOrder: [2,3,1], playerScore: 0, botScore: 0, history: [], result: 'none' };
  };
  root.innerHTML = `<main class="higher-card">
    <header><span class="eyebrow">ТРИ КАРТЫ · ТРИ РАУНДА</span><h1>Старшая карта</h1><p>Выберите момент для своей сильной карты.</p></header>
    <section class="scoreboard" aria-label="Счет"><div>Вы <strong class="player-score">0</strong></div><span class="round-label">Раунды: 0 / 3</span><div><strong class="bot-score">0</strong> Бот</div></section>
    <p class="message" role="status" aria-live="polite"></p>
    <section class="table" aria-label="Сыгранные карты"><div class="seat"><span>Вы</span><div class="table-card player-card">—</div></div><span class="versus">против</span><div class="seat"><span>Бот</span><div class="table-card bot-card">—</div></div></section>
    <section class="hand-section" aria-label="Ваши карты"><h2>Ваша рука</h2><div class="hand"></div><p class="hint">Нажмите карту или клавишу 1, 2, 3.<br>Tab — выбор кнопки, Enter / Пробел — ход.</p></section>
    <section class="history-section"><h2>История раундов</h2><ol class="history"></ol><p class="empty-history">Здесь появятся результаты ваших ходов.</p></section>
    <section class="rules"><h2>Как играть</h2><p>У каждого по три карты: 1, 2 и 3. Каждая играется один раз. Старшая карта приносит очко; равные карты — без очков.</p><p>Бот всегда играет в порядке <b>2 → 3 → 1</b>, независимо от вашего выбора. После трех раундов сравнивается счет.</p><p>Начните кнопкой «Start» на панели. «Restart» сбрасывает партию; затем нажмите «Start» снова.</p></section>
  </main>`;
  const find = s => root.querySelector(s);
  const buttons = [1,2,3].map(value => {
    const button = root.ownerDocument.createElement('button');
    button.type = 'button';
    button.className = 'hand-card';
    button.dataset.testid = 'card-' + value;
    button.innerHTML = `<span class="corner">${value}</span><span class="number">${value}</span><span class="card-state"></span>`;
    find('.hand').appendChild(button);
    ctx.input.on(button, 'click', () => dispatch({ type: 'PLAY_CARD', value }));
    ctx.input.on(button, 'keydown', event => {
      if (event.repeat && (event.key === 'Enter' || event.key === ' ')) event.preventDefault();
    });
    return button;
  });
  function render() {
    find('.player-score').textContent = state.playerScore;
    find('.bot-score').textContent = state.botScore;
    find('.round-label').textContent = 'Раунды: ' + state.roundsPlayed + ' / 3';
    const outcomes = { victory: 'Победа!', defeat: 'Поражение', draw: 'Ничья' };
    find('.message').textContent = state.phase === 'ready' ? 'Готовы? Нажмите «Start», чтобы начать.' : state.phase === 'playing' ? 'Раунд ' + (state.roundsPlayed + 1) + ': выберите оставшуюся карту' : outcomes[state.result] + ' · Итоговый счет ' + state.playerScore + ':' + state.botScore;
    const last = state.history[state.history.length - 1];
    find('.player-card').textContent = last ? last.playerCard : '—';
    find('.bot-card').textContent = last ? last.botCard : '—';
    buttons.forEach((button, index) => {
      const used = !state.playerRemaining.includes(index + 1);
      button.disabled = used || state.phase !== 'playing';
      button.classList.toggle('used', used);
      const label = used ? 'Использована' : state.phase === 'ready' ? 'До начала' : 'Выбрать';
      button.querySelector('.card-state').textContent = label;
      button.setAttribute('aria-label', 'Карта ' + (index + 1) + '. ' + label);
    });
    find('.history').replaceChildren();
    state.history.forEach(entry => {
      const item = root.ownerDocument.createElement('li');
      const result = entry.winner === 'player' ? 'Вам +1' : entry.winner === 'bot' ? 'Боту +1' : 'Ничья · без очков';
      item.textContent = 'Вы ' + entry.playerCard + ' : ' + entry.botCard + ' Бот — ' + result;
      find('.history').appendChild(item);
    });
    find('.empty-history').hidden = state.history.length > 0;
  }
  function dispatch(action) {
    if (!action || typeof action !== 'object') return;
    if (action.type === 'RESTART') {
      reset();
      render();
      return;
    }
    if (action.type === 'START') {
      if (state.phase !== 'ready') return;
      state.phase = 'playing';
      render();
      return;
    }
    if (action.type !== 'PLAY_CARD' || state.phase !== 'playing') return;
    const value = action.value;
    if (!state.playerRemaining.includes(value)) return;
    const botCard = state.botOrder[state.roundsPlayed];
    const winner = value > botCard ? 'player' : value < botCard ? 'bot' : 'draw';
    state.playerRemaining = state.playerRemaining.filter(card => card !== value);
    state.botRemaining = state.botRemaining.filter(card => card !== botCard);
    if (winner === 'player') state.playerScore++;
    if (winner === 'bot') state.botScore++;
    state.roundsPlayed++;
    state.history.push({ round: state.roundsPlayed, playerCard: value, botCard, winner });
    if (state.roundsPlayed === 3) {
      state.result = state.playerScore > state.botScore ? 'victory' : state.playerScore < state.botScore ? 'defeat' : 'draw';
      state.phase = state.result === 'defeat' ? 'lost' : 'won';
    }
    render();
  }
  ctx.input.key((key, event) => {
    if (event.repeat) return;
    if (key === '1' || key === '2' || key === '3') {
      event.preventDefault();
      dispatch({ type: 'PLAY_CARD', value: Number(key) });
    }
  });
  reset();
  render();
  return { snapshot: () => JSON.parse(JSON.stringify(state)), dispatch };
