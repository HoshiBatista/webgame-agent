.three-beacons {
  box-sizing: border-box;
  width: 100%;
  max-width: 940px;
  margin: 0 auto;
  padding: clamp(18px, 4vw, 44px);
  color: #edf4f7;
  background: radial-gradient(ellipse at 50% 65%, #193e50 0%, #0d2537 65%);
  border: 1px solid #345265;
  border-radius: 22px;
  font-family: system-ui, sans-serif;
  text-align: center;
}
.three-beacons *, .three-beacons *::before, .three-beacons *::after { box-sizing: border-box; }
.three-beacons .eyebrow { margin: 0 0 14px; color: #98bdcc; font-size: 11px; letter-spacing: .16em; }
.three-beacons h1 { margin: 0 0 14px; font-size: clamp(32px, 6vw, 52px); line-height: 1.1; }
.three-beacons .rules { max-width: 510px; margin: 0 auto; font-size: 16px; line-height: 1.6; }
.three-beacons .hint { margin: 8px 0 24px; color: #adbfcb; font-size: 13px; }
.three-beacons .counters { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 26px; font-variant-numeric: tabular-nums; }
.three-beacons .counters span { padding: 9px 15px; border: 1px solid #486171; border-radius: 24px; background: #102b3d; }
.three-beacons .beacon-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.three-beacons .beacon { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; min-width: 72px; min-height: 260px; padding: 20px 12px; border: 2px solid #456172; border-radius: 16px; background: #142f42; color: #edf4f7; font: inherit; cursor: pointer; }
.three-beacons .beacon:disabled { opacity: 1; cursor: default; }
.three-beacons .beacon:not(:disabled):hover { background: #1c4055; border-color: #97becd; }
.three-beacons .beacon:focus-visible { outline: 4px solid #fff0a9; outline-offset: 4px; }
.three-beacons .beacon-number { align-self: flex-start; color: #a4c1cd; font-size: 12px; letter-spacing: .1em; }
.three-beacons .scene { position: relative; display: block; width: 128px; height: 143px; margin: 4px 0 10px; }
.three-beacons .lighthouse { position: absolute; width: 66px; height: 122px; top: 4px; left: 31px; }
.three-beacons .roof { position: absolute; top: 0; left: 11px; width: 44px; height: 18px; background: #a5bdc8; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.three-beacons .lamp { position: absolute; top: 19px; left: 17px; width: 32px; height: 25px; border: 3px solid #afc1c8; background: #566978; border-radius: 3px; }
.three-beacons .rail { position: absolute; top: 46px; left: 6px; width: 54px; height: 6px; background: #b3c7cf; border-radius: 2px; }
.three-beacons .tower { position: absolute; top: 54px; left: 11px; width: 44px; height: 62px; background: linear-gradient(to bottom, #d4e0e4 0 32%, #54899d 32% 56%, #d4e0e4 56%); clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%); }
.three-beacons .base { position: absolute; bottom: 0; left: 1px; width: 64px; height: 6px; border-radius: 3px; background: #9fbac5; }
.three-beacons .water { position: absolute; bottom: 0; left: 0; width: 128px; height: 8px; border-top: 1px solid #548398; border-bottom: 1px solid #345e74; border-radius: 50%; }
.three-beacons .beacon-title { font-size: 19px; font-weight: 700; }
.three-beacons .beacon-state { margin-top: 6px; font-size: 15px; color: #c0d0d8; }
.three-beacons .key-hint { margin-top: 13px; font-size: 11px; color: #adc4ce; }
.three-beacons .is-lit { border-color: #d4b65d; background: #263b40; }
.three-beacons .is-lit .lamp { background: #ffe08a; border-color: #fff0b2; box-shadow: 0 0 28px 10px #ffd57645; }
.three-beacons .is-lit .beacon-state { color: #ffe39a; }
.three-beacons .outcome { min-height: 54px; margin: 24px 0 12px; padding: 12px; border-radius: 10px; background: #0b2234; line-height: 1.5; }
.three-beacons[data-phase="won"] .outcome { color: #ffe5a1; border: 1px solid #bfa15b; font-weight: 700; }
.three-beacons footer { color: #96b3c1; font-size: 12px; }
@media (max-width: 520px) {
  .three-beacons .beacon-grid { grid-template-columns: 1fr; gap: 12px; }
  .three-beacons .beacon { min-height: 190px; }
  .three-beacons .scene { height: 128px; margin-top: -10px; margin-bottom: 2px; }
  .three-beacons .key-hint { display: none; }
  .three-beacons .counters { gap: 8px; font-size: 14px; }
}

function createGame(ctx) {
  let phase = 'ready';
  let beacons = [false, false, false];
  let moves = 0;
  const root = ctx.root;
  const panel = document.createElement('section');
  panel.className = 'three-beacons';
  panel.setAttribute('aria-label', 'Три маяка');
  panel.innerHTML = '<header><p class="eyebrow">ТИХАЯ ГАВАНЬ · ГОЛОВОЛОМКА</p><h1>Три маяка</h1><p class="rules">Нажимайте на маяки или клавиши 1/2/3. Включите все три.</p><p class="hint">Повторное нажатие выключает маяк.</p></header><div class="counters"><span class="lit-count"></span><span class="move-count"></span></div><div class="beacon-grid" role="group" aria-label="Маяки"></div><p class="outcome" role="status" aria-live="polite" aria-atomic="true"></p><footer>Три огня — безопасный путь домой.</footer>';
  const grid = panel.querySelector('.beacon-grid');
  const litLabel = panel.querySelector('.lit-count');
  const movesLabel = panel.querySelector('.move-count');
  const outcome = panel.querySelector('.outcome');
  const buttons = [];
  for (let i = 0; i < 3; i += 1) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'beacon';
    button.dataset.testid = 'beacon-' + (i + 1);
    button.innerHTML = '<span class="beacon-number">0' + (i + 1) + '</span><span class="scene" aria-hidden="true"><span class="lighthouse"><span class="roof"></span><span class="lamp"></span><span class="rail"></span><span class="tower"></span><span class="base"></span></span><span class="water"></span></span><span class="beacon-title">Маяк ' + (i + 1) + '</span><span class="beacon-state"></span><span class="key-hint" aria-hidden="true">Клавиша ' + (i + 1) + '</span>';
    ctx.input.on(button, 'click', function () {
      dispatch({ type: 'TOGGLE_BEACON', beacon: i + 1 });
    });
    grid.appendChild(button);
    buttons.push(button);
  }
  root.appendChild(panel);

  function litCount() {
    return beacons.filter(Boolean).length;
  }
  function render() {
    panel.dataset.phase = phase;
    litLabel.textContent = 'Включено: ' + litCount() + ' из 3';
    movesLabel.textContent = 'Ходов: ' + moves;
    buttons.forEach(function (button, i) {
      const state = beacons[i] ? 'Включен' : 'Выключен';
      button.classList.toggle('is-lit', beacons[i]);

    return { phase: phase, beacons: beacons.slice(), litCount: litCount(), moves: moves };
  }

    if (!action || typeof action !== 'object') return;
    if (action.type === 'RESTART' || (action.type === 'START' && phase === 'ready')) {
      phase = 'playing';
      beacons = [false, false, false];
      moves = 0;
      render();
      return;
    }
    if (action.type !== 'TOGGLE_BEACON' || phase !== 'playing') return;
    const number = action.beacon;
    if (!Number.isInteger(number) || number < 1 || number > 3) return;
    beacons[number - 1] = !beacons[number - 1];
    moves += 1;
    if (litCount() === 3) phase = 'won';
    render();
  }

    if (event && (event.repeat || event.ctrlKey || event.altKey || event.metaKey)) return;

      dispatch({ type: 'TOGGLE_BEACON', beacon: Number(key) });
    }
  });
  render();
  return { snapshot: snapshot, dispatch: dispatch, dispose: function () { panel.remove(); } };
