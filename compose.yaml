name: prompt2play

x-runtime-environment: &runtime-environment
  P2P_DATABASE_URL: postgresql+psycopg://prompt2play:${P2P_POSTGRES_PASSWORD:-prompt2play}@postgres:5432/prompt2play
  P2P_REDIS_URL: redis://redis:6379/0
  P2P_ARTIFACT_ROOT: /data/artifacts
  P2P_VALIDATION_ROOT: /data/validation
  P2P_PUBLIC_BASE_URL: ${P2P_PUBLIC_BASE_URL:-http://localhost:5173}
  P2P_CORS_ORIGINS: ${P2P_CORS_ORIGINS:-http://localhost:5173}
  P2P_SESSION_TTL_HOURS: ${P2P_SESSION_TTL_HOURS:-24}
  P2P_STAGE_LEASE_SECONDS: ${P2P_STAGE_LEASE_SECONDS:-600}

x-runtime-service: &runtime-service
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - backend
  restart: unless-stopped
  stop_grace_period: 30s

x-worker-healthcheck: &worker-healthcheck
  interval: 15s
  timeout: 8s
  retries: 8
  start_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prompt2play
      POSTGRES_USER: prompt2play
      POSTGRES_PASSWORD: ${P2P_POSTGRES_PASSWORD:-prompt2play}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompt2play"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

  migrate:
    <<: *runtime-service
    build:
      context: .
      target: migration
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128

  bootstrap-admin:
    <<: *runtime-service
    build:
      context: .
      target: migration
    command: ["python", "-m", "prompt2play.bootstrap_admin"]
    environment:
      <<: *runtime-environment
      P2P_ADMIN_USERNAME: ${P2P_ADMIN_USERNAME:?Set P2P_ADMIN_USERNAME in .env}
      P2P_ADMIN_PASSWORD: ${P2P_ADMIN_PASSWORD:?Set P2P_ADMIN_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128

  api:
    <<: *runtime-service
    build:
      context: .
      target: api
    environment: *runtime-environment
    expose:
      - "8000"
    volumes:
      - artifacts:/data/artifacts:ro
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256

  worker-models:
    <<: *runtime-service
    build:
      context: .
      target: model-worker
    environment:
      <<: *runtime-environment
      P2P_MODEL_PROVIDER: ${P2P_MODEL_PROVIDER:-vllm}
      P2P_MODEL_MAX_OUTPUT_TOKENS: ${P2P_MODEL_MAX_OUTPUT_TOKENS:-64000}
      P2P_VLLM_BASE_URL: ${P2P_VLLM_BASE_URL:-http://vllm-server:8000/v1}
      P2P_VLLM_MODEL: ${P2P_VLLM_MODEL:-prompt2play-code}
      P2P_VLLM_API_KEY: ${P2P_VLLM_API_KEY:-}
      P2P_VLLM_TIMEOUT_SECONDS: ${P2P_VLLM_TIMEOUT_SECONDS:-180}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      P2P_OPENAI_MODEL: ${P2P_OPENAI_MODEL:-}
      P2P_OPENAI_REASONING_EFFORT: ${P2P_OPENAI_REASONING_EFFORT:-medium}
      P2P_OPENAI_TIMEOUT_SECONDS: ${P2P_OPENAI_TIMEOUT_SECONDS:-120}
    volumes:
      - artifacts:/data/artifacts
    networks:
      - backend
      - model-egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *worker-healthcheck
      test:
        [
          "CMD-SHELL",
          "celery -A prompt2play.tasks:celery_app inspect ping --destination models@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256

  worker-workflow:
    <<: *runtime-service
    build:
      context: .
      target: workflow-worker
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *worker-healthcheck
      test:
        [
          "CMD-SHELL",
          "celery -A prompt2play.tasks:celery_app inspect ping --destination workflow@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 192

  worker-validation:
    <<: *runtime-service
    build:
      context: .
      target: validation-worker
    environment:
      <<: *runtime-environment
      P2P_BROWSER_VALIDATION: "true"
    volumes:
      - artifacts:/data/artifacts:ro
      - validation-evidence:/data/validation
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /home/prompt2play/.cache:rw,noexec,nosuid,size=256m
    shm_size: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *worker-healthcheck
      test:
        [
          "CMD-SHELL",
          "celery -A prompt2play.tasks:celery_app inspect ping --destination validation@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

  beat:
    <<: *runtime-service
    build:
      context: .
      target: beat
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker-workflow:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from redis import Redis; assert Redis.from_url('redis://redis:6379/0').ping()",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ""
    ports:
      - "${P2P_WEB_PORT:-5173}:8080"
    networks:
      - edge
      - backend
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

volumes:
  artifacts:
  validation-evidence:
  postgres:
  redis:

networks:
  edge:
  backend:
    internal: true
  model-egress:
