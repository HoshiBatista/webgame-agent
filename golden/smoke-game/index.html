<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Prompt2Play smoke game</title>
  <style>
    * { box-sizing: border-box; touch-action: none; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #12131b; color: white; font-family: system-ui, sans-serif; }
    main { width: 100%; height: 100%; display: grid; place-items: center; position: relative; }
    canvas { width: 100%; height: 100%; }
    button { position: absolute; min-width: 180px; min-height: 64px; border: 3px solid white; border-radius: 16px; background: #ffd400; color: #111; font-size: 22px; font-weight: 900; }
  </style>
</head>
<body>
  <main><canvas id="game"></canvas><button id="start" data-p2p-action="start">Начать игру</button></main>
  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const context = canvas.getContext("2d");
      const button = document.querySelector("#start");
      const state = { phase: "ready", score: 0, level: 1, lives: 3, objective: 0 };
      function resize() {
        const ratio = Math.min(devicePixelRatio || 1, 2);
        canvas.width = innerWidth * ratio;
        canvas.height = innerHeight * ratio;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }
      function emit(event) {
        parent.postMessage({ source: "prompt2play-game", type: "game_event", event }, "*");
      }
      function updateButton() {
        button.dataset.p2pAction = state.phase === "ready" ? "start" : state.phase === "playing" ? "primary" : "restart";
        button.textContent = state.phase === "ready" ? "Начать игру" : state.phase === "playing" ? "Действие" : "Заново";
      }
      function start() {
        state.phase = "playing";
        state.score += 1;
        state.objective += 1;
        updateButton();
        emit("game_start");
      }
      function reset() {
        Object.assign(state, { phase: "ready", score: 0, level: 1, lives: 3, objective: 0 });
        updateButton();
        emit("restart");
        return { ...state };
      }
      function win() {
        state.phase = "won";
        state.score += 10;
        updateButton();
        emit("win");
        return { ...state };
      }
      function lose() {
        state.phase = "lost";
        state.lives = 0;
        updateButton();
        emit("lose");
        return { ...state };
      }
      function primary() {
        if (state.phase === "ready") start();
        else if (state.phase === "playing") { state.score += 1; state.objective += 1; }
        else reset();
        return { ...state };
      }
      button.addEventListener("pointerdown", primary);
      addEventListener("keydown", (event) => {
        if (["Space", "Enter", "ArrowRight"].includes(event.code)) {
          event.preventDefault();
          primary();
        }
      });
      addEventListener("resize", resize);
      function frame() {
        context.fillStyle = "#12131b";
        context.fillRect(0, 0, innerWidth, innerHeight);
        context.fillStyle = "#ffd400";
        context.beginPath();
        context.arc(innerWidth / 2, innerHeight / 3, 28 + state.score, 0, Math.PI * 2);
        context.fill();
        requestAnimationFrame(frame);
      }
      window.__prompt2play = {
        schemaVersion: "2",
        ready: async () => undefined,
        reset: async () => reset(),
        dispatch: async (action) => {
          if (action === "start") { start(); return { ...state }; }
          if (action === "primary") return primary();
          if (action === "force_win") return win();
          if (action === "force_lose") return lose();
          if (action === "restart") return reset();
          return { ...state };
        },
        snapshot: () => ({ ...state }),
        capabilities: () => ["keyboard", "pointer", "touch", "win", "lose", "restart"]
      };
      resize();
      frame();
    })();
  </script>
</body>
</html>
