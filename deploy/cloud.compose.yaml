# docker compose --env-file .env -f compose.yaml -f deploy/cloud.compose.yaml ...
# Caddy runs on the host; the base file publishes edge only on loopback.
x-cloud-environment: &cloud-environment
  DJANGO_ALLOWED_HOSTS: ${CLOUD_HOST:?Set CLOUD_HOST},localhost,127.0.0.1,app,preview
  DJANGO_SECURE_COOKIES: '1'
  DJANGO_TRUST_PROXY_HEADERS: '1'
  DJANGO_SSL_REDIRECT: '1'
  DJANGO_HSTS_SECONDS: '86400'
  GAMEFORGE_LOCAL_ONLY: '0'
  GAMEFORGE_PROVIDER: relay
  GAMEFORGE_APP_ORIGIN: https://${CLOUD_HOST}
  GAMEFORGE_PREVIEW_ORIGIN: https://${CLOUD_HOST}:8443
  CSRF_TRUSTED_ORIGINS: https://${CLOUD_HOST}
  GAMEFORGE_PROVIDER_CONCURRENCY: '1'

services:
  db:
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40]
  redis:
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    command: [redis-server, --appendonly, 'yes', --maxmemory, 80mb, --maxmemory-policy, noeviction]
  init:
    image: ${APP_IMAGE:?Set a release image tag}
    environment: *cloud-environment
    mem_limit: 256m
    pids_limit: 64
  app:
    image: ${APP_IMAGE}
    environment: *cloud-environment
    command: [gunicorn, 'gameforge.wsgi:application', --bind, '0.0.0.0:8000', --workers, '1', --threads, '4', --timeout, '120']
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 64
  preview:
    image: ${APP_IMAGE}
    environment: *cloud-environment
    command: [gunicorn, 'gameforge.wsgi:application', --bind, '0.0.0.0:8000', --workers, '1', --threads, '2', --timeout, '30']
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
  worker:
    image: ${APP_IMAGE}
    environment: *cloud-environment
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 96
  beat:
    image: ${APP_IMAGE}
    environment: *cloud-environment
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 64
  validator:
    image: ${VALIDATOR_IMAGE:?Set a release validator image tag}
    restart: unless-stopped
    cpus: 1.5
  edge:
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - ./deploy/cloud.nginx.conf:/etc/nginx/conf.d/default.conf:ro
