global:
  resolve_timeout: 5m
route:
  receiver: local-only
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  # Alerts are visible in Grafana and Alertmanager. Configure an explicit receiver to notify people.
  - name: local-only
inhibit_rules:
  - source_matchers: ['alertname="TelemetryCollectorDown"']
    target_matchers: ['alertname=~"StateObserverStale|WorkerMissing|BeatMissing"']
