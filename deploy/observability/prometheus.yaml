global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    installation: gameforge
storage:
  exemplars:
    max_exemplars: 10000
rule_files: [/etc/prometheus/rules.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: gameforge-otel
    static_configs:
      - targets: ['otel-collector:9464']
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
