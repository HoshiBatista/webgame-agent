# Global login limit for this small invited-user deployment. Caddy is the only ingress.
limit_req_zone $server_name zone=login:1m rate=10r/m;
server {
  listen 8080;
  server_name _;
  access_log off;
  client_max_body_size 2m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  gzip on;
  gzip_types text/css application/javascript application/json;
  set $app_backend app:8000;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_buffering off;
  proxy_read_timeout 90s;
  location = /api/login/ {
    limit_req zone=login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://$app_backend;
  }
  location /admin/ {
    # Administration is performed through SSH, not the public website.
    return 404;
  }
  location / { proxy_pass http://$app_backend; }
}
server {
  listen 8081;
  server_name _;
  access_log off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /preview/ {
    set $preview_backend preview:8000;
    proxy_pass http://$preview_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
  }
  location / { return 404; }
}
